<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>勝光@東莞美食地圖</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            baidu: {
              blue: '#3385ff',
              darkblue: '#2b73db',
              orange: '#ff6600',
              red: '#ea3526',
              bg: '#f5f5f7',
              card: '#ffffff',
              subtext: '#8c8c8c'
            }
          }
        }
      }
    }
  </script>
  
  <!-- Leaflet Map CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Inter Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: #d4d4d8;
      border-radius: 4px;
    }
    
    /* Map Marker Custom Pulsing Style */
    .custom-map-pin {
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease;
    }
    .custom-map-pin:hover {
      transform: scale(1.15) translateY(-2px);
    }
    
    /* Hide Leaflet Default Attributions for Clean App Look */
    .leaflet-control-attribution {
      font-size: 9px !important;
      opacity: 0.6;
    }
    
    /* Ensure Leaflet tiles and container always render cleanly */
    #leaflet-map {
      width: 100% !important;
      height: 100% !important;
      min-height: calc(100vh - 180px);
      background: #f4f6f8;
      z-index: 1;
    }
    .leaflet-tile {
      filter: saturate(1.05) contrast(1.02);
    }
    
    /* Smooth tab indicator transitions */
    .tab-active {
      color: #111827;
      font-weight: 700;
      position: relative;
    }
    .tab-active::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 3px;
      background: #3385ff;
      border-radius: 999px;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 flex justify-center min-h-screen antialiased">

  <!-- Main Phone Wrapper (Centered for desktop, fluid for mobile) -->
  <div class="w-full max-w-md bg-white min-h-screen flex flex-col shadow-2xl relative overflow-hidden">
    
    <!-- Top Header Navigation -->
    <header class="sticky top-0 z-30 bg-white border-b border-slate-100 select-none">
      <!-- App Brand Title Bar -->
      <div class="flex items-center justify-between px-4 pt-3 pb-1 border-b border-slate-50">
        <div class="flex items-center space-x-2">
          <span class="w-2.5 h-2.5 rounded-full bg-baidu-orange"></span>
          <h1 class="text-[17px] font-black tracking-tight text-slate-900 flex items-center space-x-1.5">
            <span>勝光</span>
            <span class="text-baidu-blue font-black text-sm">@</span>
            <span class="bg-gradient-to-r from-baidu-blue to-blue-600 bg-clip-text text-transparent">東莞美食地圖</span>
          </h1>
        </div>
        <span class="text-[11px] font-semibold text-slate-400 bg-slate-100 px-2 py-0.5 rounded-full">
          <i class="fa-solid fa-location-dot text-baidu-orange text-[10px] mr-1"></i>東莞
        </span>
      </div>

      <!-- App Header Nav (地圖 在左 / 地點 在右) -->
      <div class="flex items-center justify-between px-3 py-2">
        <button id="btn-back" class="p-2 text-slate-700 hover:bg-slate-100 rounded-full transition" title="返回" onclick="switchMainTab('map')">
          <i class="fa-solid fa-chevron-left text-lg"></i>
        </button>

        <nav class="flex items-center space-x-10 text-[15px] text-slate-500 font-medium">
          <button id="nav-tab-map" class="tab-active transition hover:text-slate-900" onclick="switchMainTab('map')">地圖</button>
          <button id="nav-tab-list" class="transition hover:text-slate-900" onclick="switchMainTab('list')">地點</button>
        </nav>

        <div class="w-7"></div> <!-- balance back button -->
      </div>

      <!-- Filter Sub-tabs (僅保留 我收藏的) -->
      <div class="flex items-center space-x-2 px-4 py-2 text-xs">
        <button class="px-3.5 py-1 rounded-full bg-blue-50 text-baidu-blue font-semibold shadow-sm">
          我收藏的
        </button>
      </div>

      <!-- Collection Bar: 默認收藏夾 + Count + Search -->
      <div class="flex items-center justify-between px-4 py-2 border-t border-slate-100 bg-white">
        <div class="flex items-baseline space-x-2">
          <span class="text-base font-bold text-slate-900">默認收藏夾</span>
          <span id="places-count" class="text-xs text-slate-400 font-bold">18</span>
        </div>
        
        <div class="flex items-center space-x-3 text-slate-600 text-sm">
          <button onclick="openAddPlaceModal()" class="flex items-center space-x-1 text-baidu-blue font-medium hover:opacity-80 active:scale-95 transition">
            <i class="fa-solid fa-plus text-xs"></i>
            <span class="text-xs font-semibold">添加地點</span>
          </button>
          <button onclick="toggleSearchBar()" class="p-1 hover:text-baidu-blue transition" title="搜尋">
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
          <button onclick="showSortFilterMenu()" class="p-1 hover:text-baidu-blue transition" title="更多選項">
            <i class="fa-solid fa-ellipsis-vertical"></i>
          </button>
        </div>
      </div>

      <!-- Quick Search Bar (Collapsible) -->
      <div id="quick-search-box" class="hidden px-4 pb-2">
        <div class="relative flex items-center">
          <i class="fa-solid fa-search absolute left-3 text-slate-400 text-xs"></i>
          <input id="search-input" type="text" placeholder="搜尋餐廳名、菜系、路名..." 
                 class="w-full bg-slate-100 pl-8 pr-8 py-1.5 rounded-lg text-xs outline-none focus:ring-2 focus:ring-baidu-blue"
                 oninput="handleSearch(this.value)">
          <button id="clear-search-btn" class="hidden absolute right-2.5 text-slate-400 hover:text-slate-600 text-xs" onclick="clearSearch()">
            <i class="fa-solid fa-circle-xmark"></i>
          </button>
        </div>
      </div>

      <!-- Category Filter Dropdown Pills -->
      <div class="flex items-center justify-around px-4 py-2 text-xs border-b border-slate-100 bg-slate-50/50">
        <div class="relative">
          <button onclick="toggleDropdown('tag-dropdown')" class="flex items-center space-x-1 text-slate-700 hover:text-baidu-blue font-medium">
            <span id="current-tag-label">全部標籤</span>
            <i class="fa-solid fa-caret-down text-[10px] text-slate-400"></i>
          </button>
          <div id="tag-dropdown" class="hidden absolute top-7 left-0 w-36 bg-white border border-slate-200 rounded-xl shadow-xl z-40 py-1 text-xs">
            <div onclick="selectTag('全部標籤')" class="px-3 py-2 hover:bg-slate-50 cursor-pointer font-medium">全部標籤</div>
            <div onclick="selectTag('火鍋/牛肉')" class="px-3 py-2 hover:bg-slate-50 cursor-pointer">火鍋/牛肉</div>
            <div onclick="selectTag('燒烤/烤肉')" class="px-3 py-2 hover:bg-slate-50 cursor-pointer">燒烤/烤肉</div>
            <div onclick="selectTag('粵菜/大排檔')" class="px-3 py-2 hover:bg-slate-50 cursor-pointer">粵菜/大排檔</div>
            <div onclick="selectTag('異國料理')" class="px-3 py-2 hover:bg-slate-50 cursor-pointer">異國料理</div>
            <div onclick="selectTag('甜品/小吃')" class="px-3 py-2 hover:bg-slate-50 cursor-pointer">甜品/小吃</div>
          </div>
        </div>

        <div class="relative">
          <button onclick="toggleDropdown('type-dropdown')" class="flex items-center space-x-1 text-slate-700 hover:text-baidu-blue font-medium">
            <span id="current-type-label">全部類型</span>
            <i class="fa-solid fa-caret-down text-[10px] text-slate-400"></i>
          </button>
          <div id="type-dropdown" class="hidden absolute top-7 left-1/2 -translate-x-1/2 w-32 bg-white border border-slate-200 rounded-xl shadow-xl z-40 py-1 text-xs">
            <div onclick="selectType('全部類型')" class="px-3 py-2 hover:bg-slate-50 cursor-pointer font-medium">全部類型</div>
            <div onclick="selectType('正餐餐廳')" class="px-3 py-2 hover:bg-slate-50 cursor-pointer">正餐餐廳</div>
            <div onclick="selectType('休閒小酌')" class="px-3 py-2 hover:bg-slate-50 cursor-pointer">休閒小酌</div>
            <div onclick="selectType('街頭小吃')" class="px-3 py-2 hover:bg-slate-50 cursor-pointer">街頭小吃</div>
          </div>
        </div>

        <div class="relative">
          <button onclick="toggleDropdown('city-dropdown')" class="flex items-center space-x-1 text-slate-700 hover:text-baidu-blue font-medium">
            <span id="current-city-label">東莞市</span>
            <i class="fa-solid fa-caret-down text-[10px] text-slate-400"></i>
          </button>
          <div id="city-dropdown" class="hidden absolute top-7 right-0 w-32 bg-white border border-slate-200 rounded-xl shadow-xl z-40 py-1 text-xs">
            <div onclick="selectCity('東莞市 (全部)')" class="px-3 py-2 hover:bg-slate-50 cursor-pointer font-medium">東莞市 (全部)</div>
            <div onclick="selectCity('東城區')" class="px-3 py-2 hover:bg-slate-50 cursor-pointer">東城區</div>
            <div onclick="selectCity('莞城區')" class="px-3 py-2 hover:bg-slate-50 cursor-pointer">莞城區</div>
            <div onclick="selectCity('石碣鎮')" class="px-3 py-2 hover:bg-slate-50 cursor-pointer">石碣鎮</div>
            <div onclick="selectCity('清溪鎮')" class="px-3 py-2 hover:bg-slate-50 cursor-pointer">清溪鎮</div>
          </div>
        </div>
      </div>
    </header>

    <!-- Content Area: Map View (Default) or List View -->
    <main class="flex-1 relative overflow-y-auto pb-24 flex flex-col" id="main-scroll-container">
      
      <!-- 1. Interactive Map View (Active on load) -->
      <section id="places-map-view" class="w-full flex-1 flex flex-col relative bg-slate-100">
        <!-- Leaflet Map Container -->
        <div id="leaflet-map" class="w-full flex-1 relative"></div>
        
        <!-- Floating Controls on Map -->
        <div class="absolute top-4 right-4 z-[500] flex flex-col space-y-2">
          <button onclick="switchMainTab('list')" class="px-3 py-2 bg-white/95 backdrop-blur-md rounded-xl shadow-lg flex items-center space-x-1.5 text-xs text-slate-800 font-bold hover:text-baidu-blue active:scale-95 transition border border-slate-200" title="切換至列表">
            <i class="fa-solid fa-list-ul text-baidu-blue"></i>
            <span>列表模式</span>
          </button>
          <button onclick="focusDeltaPlant()" class="px-3 py-2 bg-gradient-to-r from-amber-500 to-yellow-500 text-white rounded-xl shadow-lg flex items-center space-x-1.5 text-xs font-bold hover:from-amber-600 hover:to-yellow-600 active:scale-95 transition border border-amber-300" title="定位台達7廠">
            <i class="fa-solid fa-star text-yellow-100 text-xs"></i>
            <span>★ 台達7廠</span>
          </button>
          <button onclick="resetMapView()" class="w-9 h-9 bg-white rounded-xl shadow-md flex items-center justify-center text-slate-700 hover:text-baidu-blue active:scale-95 transition self-end" title="復位地圖">
            <i class="fa-solid fa-location-crosshairs text-sm"></i>
          </button>
          <button onclick="openAddPlaceModal()" class="w-9 h-9 bg-baidu-blue text-white rounded-xl shadow-md flex items-center justify-center hover:bg-baidu-darkblue active:scale-95 transition self-end" title="在此新增店">
            <i class="fa-solid fa-plus text-sm"></i>
          </button>
        </div>

        <!-- Floating Card at Bottom of Map for Selected Restaurant or Landmark -->
        <div id="map-active-card" class="hidden absolute bottom-4 left-3 right-3 z-[500] bg-white rounded-2xl p-4 shadow-2xl border border-slate-200 transition-all transform duration-300">
          <!-- Populated by JS -->
        </div>
      </section>

      <!-- 2. Places List View (Hidden initially) -->
      <section id="places-list-view" class="hidden divide-y divide-slate-100 bg-white flex-1">
        <!-- Rendered dynamically by renderPlacesList() -->
      </section>

      <!-- Floating Quick Toggle on List View -->
      <div id="floating-map-btn" class="hidden fixed bottom-20 right-4 z-20">
        <button onclick="switchMainTab('map')" class="bg-slate-900/90 text-white px-3.5 py-2.5 rounded-full shadow-2xl flex items-center space-x-2 text-xs font-semibold backdrop-blur-md hover:bg-baidu-blue active:scale-95 transition border border-white/20">
          <i class="fa-solid fa-map-location-dot text-baidu-orange"></i>
          <span>地圖找店</span>
        </button>
      </div>

    </main>

    <!-- Fixed Bottom Action Bar (Simplified: Add New Place only) -->
    <footer class="fixed bottom-0 max-w-md w-full bg-white/95 backdrop-blur-md border-t border-slate-200 z-30 px-4 py-2.5 flex items-center justify-center shadow-lg">
      <button onclick="openAddPlaceModal()" class="w-full bg-baidu-blue hover:bg-baidu-darkblue active:scale-98 text-white font-bold text-sm py-2.5 rounded-full shadow-md flex items-center justify-center space-x-2 transition">
        <i class="fa-solid fa-plus text-xs"></i>
        <span>添加新美食</span>
      </button>
    </footer>

    <!-- MODAL 1: Add New Restaurant -->
    <div id="modal-add-place" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-end sm:items-center justify-center hidden opacity-0 transition-opacity duration-200">
      <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl max-h-[90vh] overflow-y-auto p-5 shadow-2xl">
        <div class="flex items-center justify-between pb-3 border-b border-slate-100">
          <div class="flex items-center space-x-2">
            <span class="w-2.5 h-2.5 bg-baidu-orange rounded-full"></span>
            <h3 class="text-base font-bold text-slate-900">新增美食地點</h3>
          </div>
          <button onclick="closeModal('modal-add-place')" class="text-slate-400 hover:text-slate-600 p-1">
            <i class="fa-solid fa-xmark text-lg"></i>
          </button>
        </div>

        <form id="form-add-place" onsubmit="handleCreatePlace(event)" class="mt-4 space-y-3.5 text-xs">
          <div>
            <label class="block font-semibold text-slate-700 mb-1">店名 / 餐廳名稱 *</label>
            <input type="text" id="new-place-name" required placeholder="例如：喜茶 (世博廣場店)" 
                   class="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-baidu-blue outline-none">
          </div>

          <div>
            <label class="block font-semibold text-slate-700 mb-1">詳細地址 *</label>
            <input type="text" id="new-place-address" required placeholder="例如：東莞市東城街道世博廣場C區101號" 
                   class="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-baidu-blue outline-none">
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block font-semibold text-slate-700 mb-1">美食標籤類別</label>
              <select id="new-place-tag" class="w-full border border-slate-200 rounded-xl px-2 py-2 text-xs focus:ring-2 focus:ring-baidu-blue outline-none bg-white">
                <option value="火鍋/牛肉">火鍋/牛肉</option>
                <option value="燒烤/烤肉">燒烤/烤肉</option>
                <option value="粵菜/大排檔">粵菜/大排檔</option>
                <option value="異國料理">異國料理</option>
                <option value="甜品/小吃">甜品/小吃</option>
              </select>
            </div>
            <div>
              <label class="block font-semibold text-slate-700 mb-1">所在區域</label>
              <select id="new-place-area" class="w-full border border-slate-200 rounded-xl px-2 py-2 text-xs focus:ring-2 focus:ring-baidu-blue outline-none bg-white">
                <option value="東城區">東城區</option>
                <option value="莞城區">莞城區</option>
                <option value="石碣鎮">石碣鎮</option>
                <option value="清溪鎮">清溪鎮</option>
                <option value="高埗鎮">高埗鎮</option>
                <option value="其他區域">其他區域</option>
              </select>
            </div>
          </div>

          <div>
            <label class="block font-semibold text-slate-700 mb-1">人均消費 (預估 ¥)</label>
            <input type="number" id="new-place-price" min="5" max="2000" placeholder="例如：85" 
                   class="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-baidu-blue outline-none">
          </div>

          <div>
            <label class="block font-semibold text-slate-700 mb-1">初次評分 (星級)</label>
            <div class="flex items-center space-x-1.5 text-amber-400 text-lg cursor-pointer" id="new-rating-stars">
              <i class="fa-solid fa-star" onclick="setNewShopRating(1)"></i>
              <i class="fa-solid fa-star" onclick="setNewShopRating(2)"></i>
              <i class="fa-solid fa-star" onclick="setNewShopRating(3)"></i>
              <i class="fa-solid fa-star" onclick="setNewShopRating(4)"></i>
              <i class="fa-solid fa-star" onclick="setNewShopRating(5)"></i>
              <span id="new-rating-label" class="text-xs text-slate-500 font-semibold ml-2">5.0 分</span>
            </div>
          </div>

          <div>
            <label class="block font-semibold text-slate-700 mb-1">第一條探店短評</label>
            <textarea id="new-place-review" rows="2" placeholder="寫寫你的必吃推薦菜、口味、排隊情況..." 
                      class="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-baidu-blue outline-none"></textarea>
          </div>

          <div class="pt-2 flex items-center justify-end space-x-2">
            <button type="button" onclick="closeModal('modal-add-place')" class="px-4 py-2 rounded-xl text-slate-600 hover:bg-slate-100 font-medium">取消</button>
            <button type="submit" class="px-5 py-2 rounded-xl bg-baidu-blue text-white font-bold hover:bg-baidu-darkblue shadow-md transition">立即保存地點</button>
          </div>
        </form>
      </div>
    </div>

    <!-- MODAL 2: Reviews & Rating Drawer -->
    <div id="modal-reviews-drawer" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-end sm:items-center justify-center hidden opacity-0 transition-opacity duration-200">
      <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl max-h-[88vh] flex flex-col p-5 shadow-2xl">
        <!-- Header -->
        <div class="flex items-start justify-between pb-3 border-b border-slate-100">
          <div>
            <span class="inline-block px-2 py-0.5 bg-orange-100 text-baidu-orange text-[10px] font-bold rounded-md mb-1" id="drawer-tag">火鍋</span>
            <h3 class="text-base font-bold text-slate-900 leading-tight" id="drawer-title">店名</h3>
            <p class="text-xs text-slate-500 mt-0.5" id="drawer-address">地址</p>
          </div>
          <button onclick="closeModal('modal-reviews-drawer')" class="text-slate-400 hover:text-slate-600 p-1">
            <i class="fa-solid fa-xmark text-lg"></i>
          </button>
        </div>

        <!-- Rating Summary Box -->
        <div class="flex items-center justify-between bg-slate-50 rounded-2xl p-3.5 my-3">
          <div class="flex items-center space-x-3">
            <span class="text-3xl font-extrabold text-amber-500" id="drawer-rating-num">4.8</span>
            <div>
              <div class="flex text-amber-400 text-xs" id="drawer-rating-stars">
                <i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star-half-stroke"></i>
              </div>
              <p class="text-[11px] text-slate-400 mt-0.5"><span id="drawer-reviews-count">3</span> 條真實評價</p>
            </div>
          </div>
          <button onclick="focusReviewInput()" class="px-3 py-1.5 bg-white border border-baidu-blue text-baidu-blue font-bold text-xs rounded-xl shadow-xs hover:bg-blue-50 active:scale-95 transition">
            <i class="fa-solid fa-pen-to-square mr-1"></i>寫評價
          </button>
        </div>

        <!-- Reviews Scrollable List -->
        <div class="flex-1 overflow-y-auto space-y-3 pr-1 py-1" id="drawer-reviews-list">
          <!-- Rendered dynamically -->
        </div>

        <!-- Add Review Form (Footer input) -->
        <div class="pt-3 border-t border-slate-100">
          <div class="flex items-center justify-between mb-1.5">
            <span class="text-xs font-semibold text-slate-700">添加我的評分</span>
            <div class="flex items-center space-x-1 text-amber-400 text-base" id="user-review-stars">
              <i class="fa-solid fa-star cursor-pointer" onclick="setUserRatingScore(1)"></i>
              <i class="fa-solid fa-star cursor-pointer" onclick="setUserRatingScore(2)"></i>
              <i class="fa-solid fa-star cursor-pointer" onclick="setUserRatingScore(3)"></i>
              <i class="fa-solid fa-star cursor-pointer" onclick="setUserRatingScore(4)"></i>
              <i class="fa-solid fa-star cursor-pointer" onclick="setUserRatingScore(5)"></i>
              <span id="user-rating-score-display" class="text-xs font-bold text-slate-700 ml-1">5.0</span>
            </div>
          </div>
          <div class="flex space-x-2">
            <input type="text" id="user-review-text" placeholder="留下您的美味點評或招牌菜推薦..."

          </div>
        `;

        const customIcon = L.divIcon({
          html: iconHtml,
          className: 'custom-map-pin',
          iconSize: [32, 36],
          iconAnchor: [16, 36],
          popupAnchor: [0, -36]
        });

        const marker = L.marker([place.lat, place.lng], { icon: customIcon });
        
        marker.on('click', () => {
          showMapActiveCard(place);
          map.panTo([place.lat, place.lng]);
        });

        marker.addTo(markersLayer);
        leafletMarkers[place.id] = marker;
      });
    }

    function renderDeltaStarMarker() {
      const starMarkerHtml = `
        <div class="flex flex-col items-center cursor-pointer select-none group">
          <div class="px-2 py-0.5 bg-red-600 text-white text-[10px] font-black rounded-full shadow-lg mb-1 whitespace-nowrap border-2 border-white flex items-center space-x-1 animate-pulse">
            <i class="fa-solid fa-star text-amber-300 text-[10px]"></i>
            <span>台達電子7廠</span>
          </div>
          <div class="relative flex items-center justify-center">
            <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-amber-500 via-yellow-400 to-amber-300 text-white flex items-center justify-center shadow-2xl border-2 border-white ring-4 ring-yellow-400/40 transform transition group-hover:scale-125 group-active:scale-95">
              <i class="fa-solid fa-star text-lg text-white drop-shadow"></i>
            </div>
            <div class="absolute -bottom-1 w-2.5 h-2.5 bg-amber-500 rotate-45 border-r border-b border-white"></div>
          </div>
        </div>
      `;

      const starIcon = L.divIcon({
        html: starMarkerHtml,
        className: 'custom-delta-star-pin',
        iconSize: [80, 68],
        iconAnchor: [40, 64],
        popupAnchor: [0, -64]
      });

      deltaMarker = L.marker([DELTA_PLANT_7.lat, DELTA_PLANT_7.lng], { 
        icon: starIcon,
        zIndexOffset: 1000
      });

      deltaMarker.on('click', () => {
        showDeltaPlantCard();
        map.panTo([DELTA_PLANT_7.lat, DELTA_PLANT_7.lng]);
      });

      deltaMarker.addTo(markersLayer);
    }

    function showDeltaPlantCard() {
      const card = document.getElementById('map-active-card');
      card.innerHTML = `
        <div class="flex items-start justify-between">
          <div class="flex-1 pr-2">
            <div class="flex items-center space-x-1.5">
              <span class="px-2 py-0.5 bg-red-100 text-red-600 font-black text-[10px] rounded-full border border-red-200">
                <i class="fa-solid fa-star text-amber-500 mr-0.5"></i>廠區地標
              </span>
              <h4 class="font-bold text-sm text-slate-900 truncate">${DELTA_PLANT_7.name}</h4>
            </div>
            <p class="text-xs text-slate-500 mt-1 truncate">
              <i class="fa-solid fa-location-dot text-baidu-blue mr-1"></i>${DELTA_PLANT_7.address}
            </p>
            <div class="mt-2 text-xs bg-amber-50 rounded-xl p-2 border border-amber-200/60 text-slate-700">
              <span class="font-bold text-amber-700 block mb-0.5"><i class="fa-solid fa-utensils text-xs mr-1 text-baidu-orange"></i>廠區周邊近距美食：</span>
              <div class="flex flex-wrap gap-1.5 mt-1">
                <button onclick="focusPlaceOnMap('r18')" class="px-2 py-0.5 bg-white rounded-md text-[11px] font-semibold text-slate-800 border border-amber-300 hover:text-baidu-blue shadow-2xs">
                  新疆羊肉燒烤 (鶴田廈店) →
                </button>
                <button onclick="focusPlaceOnMap('r6')" class="px-2 py-0.5 bg-white rounded-md text-[11px] font-semibold text-slate-800 border border-amber-300 hover:text-baidu-blue shadow-2xs">
                  西貢越南粉 →
                </button>
              </div>
            </div>
          </div>
          <button onclick="document.getElementById('map-active-card').classList.add('hidden')" class="text-slate-400 hover:text-slate-600 p-1">
            <i class="fa-solid fa-xmark text-sm"></i>
          </button>
        </div>
        <div class="mt-3 flex items-center space-x-2 pt-2 border-t border-slate-100">
          <button onclick="navigateRouteTo('${DELTA_PLANT_7.name}')" class="w-full py-2 rounded-xl bg-gradient-to-r from-red-600 to-amber-600 text-white text-xs font-bold shadow-md hover:opacity-90 active:scale-95 transition flex items-center justify-center space-x-1.5">
            <i class="fa-solid fa-diamond-turn-right text-xs"></i>
            <span>以台達7廠為起點導航周邊美食</span>
          </button>
        </div>
      `;
      card.classList.remove('hidden');
    }

    function focusDeltaPlant() {
      if (activeTab !== 'map') {
        switchMainTab('map');
      }
      setTimeout(() => {
        if (map) {
          map.invalidateSize(true);
          map.flyTo([DELTA_PLANT_7.lat, DELTA_PLANT_7.lng], 15, { duration: 1.2 });
          showDeltaPlantCard();
        }
      }, 200);
      showToast('已定位至：★ 台達電子 (東莞) 7廠');
    }

    function showMapActiveCard(place) {
      const card = document.getElementById('map-active-card');
      card.innerHTML = `
        <div class="flex items-start justify-between">
          <div class="flex-1 pr-2">
            <div class="flex items-center space-x-1.5">
              <span class="px-1.5 py-0.5 bg-orange-100 text-baidu-orange font-bold text-[10px] rounded">${place.tag}</span>
              <h4 class="font-bold text-sm text-slate-900 truncate">${escapeHtml(place.name)}</h4>
            </div>
            <p class="text-xs text-slate-500 mt-1 truncate"><i class="fa-solid fa-location-dot text-baidu-blue mr-1"></i>${escapeHtml(place.address)}</p>
            <div class="flex items-center space-x-2 mt-2 text-xs">
              <span class="text-amber-500 font-bold"><i class="fa-solid fa-star text-[11px] mr-0.5"></i>${place.rating.toFixed(1)} 分</span>
              <span class="text-slate-400">(${place.reviews ? place.reviews.length : 0}條評價)</span>
              ${place.avgPrice ? `<span class="text-slate-600 font-medium">人均 ¥${place.avgPrice}</span>` : ''}
            </div>
          </div>
          <button onclick="document.getElementById('map-active-card').classList.add('hidden')" class="text-slate-400 hover:text-slate-600 p-1">
            <i class="fa-solid fa-xmark text-sm"></i>
          </button>
        </div>
        <div class="mt-3 flex items-center space-x-2 pt-2 border-t border-slate-100">
          <button onclick="openReviewsDrawer('${place.id}')" class="flex-1 py-1.5 rounded-xl bg-blue-50 text-baidu-blue text-xs font-bold hover:bg-blue-100 transition">
            <i class="fa-solid fa-comments mr-1"></i>看評價 (${place.reviews ? place.reviews.length : 0})
          </button>
          <button onclick="navigateRouteTo('${place.name}')" class="flex-1 py-1.5 rounded-xl bg-baidu-blue text-white text-xs font-bold hover:bg-baidu-darkblue shadow-sm transition">
            <i class="fa-solid fa-diamond-turn-right mr-1"></i>導航路線
          </button>
        </div>
      `;
      card.classList.remove('hidden');
    }

    function focusPlaceOnMap(id) {
      const place = places.find(p => p.id === id);
      if (!place) return;
      switchMainTab('map');
      setTimeout(() => {
        if (map) {
          map.invalidateSize(true);
          map.flyTo([place.lat, place.lng], 15, { duration: 1.2 });
          showMapActiveCard(place);
        }
      }, 250);
    }

    function resetMapView() {
      if (map) {
        map.flyTo([23.033, 113.785], 12);
        document.getElementById('map-active-card').classList.add('hidden');
        showToast('已復位全覽東莞美食分佈');
      }
    }

    function toggleDropdown(id) {
      const el = document.getElementById(id);
      const isHidden = el.classList.contains('hidden');
      ['tag-dropdown', 'type-dropdown', 'city-dropdown'].forEach(d => document.getElementById(d).classList.add('hidden'));
      if (isHidden) el.classList.remove('hidden');
    }

    function selectTag(tag) {
      currentFilterTag = tag;
      document.getElementById('current-tag-label').textContent = tag;
      document.getElementById('tag-dropdown').classList.add('hidden');
      renderPlacesList();
      if (map) syncMapMarkers();
    }

    function selectType(type) {
      currentFilterType = type;
      document.getElementById('current-type-label').textContent = type;
      document.getElementById('type-dropdown').classList.add('hidden');
      renderPlacesList();
      if (map) syncMapMarkers();
    }

    function selectCity(city) {
      currentFilterCity = city;
      document.getElementById('current-city-label').textContent = city.replace(' (全部)', '');
      document.getElementById('city-dropdown').classList.add('hidden');
      renderPlacesList();
      if (map) syncMapMarkers();
    }

    function resetFilters() {
      currentFilterTag = '全部標籤';
      currentFilterType = '全部類型';
      currentFilterCity = '東莞市 (全部)';
      searchQuery = '';
      document.getElementById('current-tag-label').textContent = '全部標籤';
      document.getElementById('current-type-label').textContent = '全部類型';
      document.getElementById('current-city-label').textContent = '東莞市';
      document.getElementById('search-input').value = '';
      renderPlacesList();
      if (map) syncMapMarkers();
    }

    function toggleSearchBar() {
      const bar = document.getElementById('quick-search-box');
      bar.classList.toggle('hidden');
      if (!bar.classList.contains('hidden')) {
        document.getElementById('search-input').focus();
      }
    }

    function handleSearch(val) {
      searchQuery = val;
      const clearBtn = document.getElementById('clear-search-btn');
      if (val.length > 0) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }
      renderPlacesList();
      if (map) syncMapMarkers();
    }

    function clearSearch() {
      document.getElementById('search-input').value = '';
      searchQuery = '';
      document.getElementById('clear-search-btn').classList.add('hidden');
      renderPlacesList();
      if (map) syncMapMarkers();
    }

    function openModal(id) {
      const modal = document.getElementById(id);
      modal.classList.remove('hidden');
      setTimeout(() => {
        modal.classList.remove('opacity-0');
      }, 10);
    }

    function closeModal(id) {
      const modal = document.getElementById(id);
      modal.classList.add('opacity-0');
      setTimeout(() => {
        modal.classList.add('hidden');
      }, 200);
    }

    function openAddPlaceModal() {
      newShopRatingValue = 5.0;
      updateNewRatingDisplay();
      document.getElementById('form-add-place').reset();
      openModal('modal-add-place');
    }

    function setNewShopRating(score) {
      newShopRatingValue = score;
      updateNewRatingDisplay();
    }

    function updateNewRatingDisplay() {
      const starsContainer = document.getElementById('new-rating-stars');
      const icons = starsContainer.querySelectorAll('i');
      icons.forEach((icon, idx) => {
        if (idx < newShopRatingValue) {
          icon.className = 'fa-solid fa-star';
        } else {
          icon.className = 'fa-regular fa-star';
        }
      });
      document.getElementById('new-rating-label').textContent = `${newShopRatingValue.toFixed(1)} 分`;
    }

    function handleCreatePlace(e) {
      e.preventDefault();
      const name = document.getElementById('new-place-name').value.trim();
      const address = document.getElementById('new-place-address').value.trim();
      const tag = document.getElementById('new-place-tag').value;
      const area = document.getElementById('new-place-area').value;
      const price = document.getElementById('new-place-price').value;
      const reviewText = document.getElementById('new-place-review').value.trim();

      if (!name || !address) {
        showToast('請完整填寫店名與地址');
        return;
      }

      // Generate realistic coordinates around Dongguan center
      const latOffset = (Math.random() - 0.5) * 0.06;
      const lngOffset = (Math.random() - 0.5) * 0.06;
      const newLat = 23.033 + latOffset;
      const newLng = 113.780 + lngOffset;

      const newId = 'r_' + Date.now();
      const newPlace = {
        id: newId,
        name: name,
        address: address,
        tag: tag,
        type: '正餐餐厅',
        city: area,
        lat: newLat,
        lng: newLng,
        rating: newShopRatingValue,
        avgPrice: price ? parseInt(price) : null,
        reviews: []
      };

      if (reviewText) {
        newPlace.reviews.push({
          author: "我",
          score: newShopRatingValue,
          date: new Date().toISOString().split('T')[0],
          text: reviewText
        });
      }

      places.unshift(newPlace);

      closeModal('modal-add-place');
      renderPlacesList();
      if (map) syncMapMarkers();
      showToast(`已成功添加「${name}」至收藏夾！`);
    }

    function openReviewsDrawer(placeId) {
      currentReviewingPlaceId = placeId;
      const place = places.find(p => p.id === placeId);
      if (!place) return;

      document.getElementById('drawer-title').textContent = place.name;
      document.getElementById('drawer-address').textContent = place.address;
      document.getElementById('drawer-tag').textContent = place.tag;
      document.getElementById('drawer-rating-num').textContent = place.rating.toFixed(1);
      document.getElementById('drawer-reviews-count').textContent = place.reviews ? place.reviews.length : 0;
      
      renderDrawerStars(place.rating);
      renderDrawerReviewsList(place);

      userReviewRatingValue = 5.0;
      setUserRatingScore(5);
      document.getElementById('user-review-text').value = '';

      openModal('modal-reviews-drawer');
    }

    function renderDrawerStars(score) {
      const container = document.getElementById('drawer-rating-stars');
      let starsHtml = '';
      for (let i = 1; i <= 5; i++) {
        if (score >= i) {
          starsHtml += '<i class="fa-solid fa-star"></i>';
        } else if (score >= i - 0.5) {
          starsHtml += '<i class="fa-solid fa-star-half-stroke"></i>';
        } else {
          starsHtml += '<i class="fa-regular fa-star text-slate-300"></i>';
        }
      }
      container.innerHTML = starsHtml;
    }

    function renderDrawerReviewsList(place) {
      const listContainer = document.getElementById('drawer-reviews-list');
      if (!place.reviews || place.reviews.length === 0) {
        listContainer.innerHTML = `
          <div class="py-8 text-center text-slate-400 text-xs">
            <i class="fa-regular fa-comment-dots text-2xl mb-2 text-slate-300"></i>
            <p>暫無評價，快來成為第一個打分點評的美食家！</p>
          </div>
        `;
        return;
      }

      let html = '';
      place.reviews.forEach(rev => {
        let starsHtml = '';
        for (let i = 1; i <= 5; i++) {
          starsHtml += (i <= rev.score) 
            ? '<i class="fa-solid fa-star text-amber-400"></i>' 
            : '<i class="fa-regular fa-star text-slate-200"></i>';
        }

        html += `
          <div class="p-3 bg-slate-50 rounded-2xl text-xs space-y-1.5 border border-slate-100">
            <div class="flex items-center justify-between">
              <div class="flex items-center space-x-2">
                <div class="w-6 h-6 rounded-full bg-blue-100 text-baidu-blue font-bold flex items-center justify-center text-[10px]">
                  ${rev.author ? rev.author.charAt(0) : '客'}
                </div>
                <span class="font-bold text-slate-800">${escapeHtml(rev.author)}</span>
              </div>
              <span class="text-[10px] text-slate-400">${rev.date}</span>
            </div>
            <div class="flex items-center space-x-1 text-[10px]">
              ${starsHtml}
              <span class="text-amber-500 font-semibold ml-1">${Number(rev.score).toFixed(1)}分</span>
            </div>
            <p class="text-slate-700 leading-relaxed font-normal">${escapeHtml(rev.text)}</p>
          </div>
        `;
      });

      listContainer.innerHTML = html;
    }

    function setUserRatingScore(score) {
      userReviewRatingValue = score;
      const container = document.getElementById('user-review-stars');
      const icons = container.querySelectorAll('i');
      icons.forEach((icon, idx) => {
        if (idx < score) {
          icon.className = 'fa-solid fa-star cursor-pointer';
        } else {
          icon.className = 'fa-regular fa-star cursor-pointer text-slate-300';
        }
      });
      document.getElementById('user-rating-score-display').textContent = `${score}.0`;
    }

    function focusReviewInput() {
      document.getElementById('user-review-text').focus();
    }

    function submitUserReview() {
      const text = document.getElementById('user-review-text').value.trim();
      if (!text) {
        showToast('請輸入評價內容！');
        return;
      }

      const place = places.find(p => p.id === currentReviewingPlaceId);
      if (!place) return;

      const newReview = {
        author: "美食探索官",
        score: userReviewRatingValue,
        date: new Date().toISOString().split('T')[0],
        text: text
      };

      if (!place.reviews) place.reviews = [];
      place.reviews.unshift(newReview);

      const sum = place.reviews.reduce((acc, r) => acc + r.score, 0);
      place.rating = parseFloat((sum / place.reviews.length).toFixed(1));

      document.getElementById('drawer-rating-num').textContent = place.rating.toFixed(1);
      document.getElementById('drawer-reviews-count').textContent = place.reviews.length;
      renderDrawerStars(place.rating);
      renderDrawerReviewsList(place);
      document.getElementById('user-review-text').value = '';

      renderPlacesList();
      if (map) syncMapMarkers();

      showToast('感謝您的點評，評分已更新！');
    }

    function showPlaceActionSheet(placeId) {
      const place = places.find(p => p.id === placeId);
      if (!place) return;

      confirmModal(
        `操作：${place.name}`,
        `您可以查看詳情、在地圖上導航或刪除該收藏點。`,
        [
          { label: '在地圖定位', primary: true, action: () => focusPlaceOnMap(place.id) },
          { label: '修改/點評', primary: false, action: () => openReviewsDrawer(place.id) },
          { label: '移除收藏', danger: true, action: () => deletePlace(place.id) }
        ]
      );
    }

    function deletePlace(placeId) {
      places = places.filter(p => p.id !== placeId);
      renderPlacesList();
      if (map) syncMapMarkers();
      showToast('已從默認收藏夾中移除');
    }

    function navigateRouteTo(placeName) {
      showToast(`正在調起導航規劃至：${placeName}`);
    }

    function showSortFilterMenu() {
      showToast('按收藏時間降序排列中');
    }

    let toastTimer = null;
    function showToast(msg) {
      const toast = document.getElementById('toast-box');
      const message = document.getElementById('toast-message');
      message.textContent = msg;
      toast.classList.remove('opacity-0');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.add('opacity-0');
      }, 2400);
    }

    function confirmModal(title, msg, buttons) {
      const existing = document.getElementById('custom-confirm-modal');
      if (existing) existing.remove();

      const modalEl = document.createElement('div');
      modalEl.id = 'custom-confirm-modal';
      modalEl.className = 'fixed inset-0 z-[100] bg-black/50 backdrop-blur-xs flex items-center justify-center p-4';
      
      let buttonsHtml = '';
      buttons.forEach((btn, index) => {
        let btnClass = 'w-full py-2.5 rounded-xl font-bold text-xs transition ';
        if (btn.danger) {
          btnClass += 'bg-red-50 text-red-600 hover:bg-red-100';
        } else if (btn.primary) {
          btnClass += 'bg-baidu-blue text-white hover:bg-baidu-darkblue';
        } else {
          btnClass += 'bg-slate-100 text-slate-700 hover:bg-slate-200';
        }
        buttonsHtml += `<button id="custom-modal-btn-${index}" class="${btnClass}">${btn.label}</button>`;
      });

      modalEl.innerHTML = `
        <div class="bg-white rounded-2xl w-full max-w-xs p-5 shadow-2xl space-y-4">
          <div>
            <h4 class="font-bold text-slate-900 text-sm">${escapeHtml(title)}</h4>
            <p class="text-xs text-slate-500 mt-1">${escapeHtml(msg)}</p>
          </div>
          <div class="space-y-2 pt-2">
            ${buttonsHtml}
            <button id="custom-modal-cancel" class="w-full py-2 rounded-xl text-slate-400 text-xs hover:text-slate-600">關閉</button>
          </div>
        </div>
      `;

      document.body.appendChild(modalEl);

      buttons.forEach((btn, index) => {
        document.getElementById(`custom-modal-btn-${index}`).addEventListener('click', () => {
          modalEl.remove();
          if (btn.action) btn.action();
        });
      });

      document.getElementById('custom-modal-cancel').addEventListener('click', () => {
        modalEl.remove();
      });
    }

    function escapeHtml(string) {
      if (!string) return '';
      return String(string)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
