<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>勝光@東莞美食地圖</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            baidu: {
              blue: '#3385ff',
              darkblue: '#246cdb',
              orange: '#ff6600',
              red: '#ea3526',
              bg: '#f6f7fb',
              card: '#ffffff',
              subtext: '#8c8c8c'
            }
          }
        }
      }
    }
  </script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Inter Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: #d4d4d8;
      border-radius: 4px;
    }
    
    .filter-pill-active {
      background-color: #3385ff;
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(51, 133, 255, 0.25);
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 flex justify-center min-h-screen antialiased">

  <!-- Main Container (Centered on desktop, fluid mobile) -->
  <div class="w-full max-w-md bg-baidu-bg min-h-screen flex flex-col shadow-2xl relative overflow-hidden">
    
    <!-- Top Header Navigation -->
    <header class="sticky top-0 z-30 bg-white border-b border-slate-100 select-none shadow-xs">
      <!-- App Brand Title Bar -->
      <div class="flex items-center justify-between px-4 pt-3 pb-2 border-b border-slate-50">
        <div class="flex items-center space-x-2">
          <span class="w-2.5 h-2.5 rounded-full bg-baidu-orange animate-pulse"></span>
          <h1 class="text-[17px] font-black tracking-tight text-slate-900 flex items-center space-x-1.5">
            <span>勝光</span>
            <span class="text-baidu-blue font-black text-sm">@</span>
            <span class="bg-gradient-to-r from-baidu-blue to-blue-600 bg-clip-text text-transparent">東莞美食地圖</span>
          </h1>
        </div>
        <div class="flex items-center space-x-1.5">
          <a href="https://map.baidu.com" target="_blank" class="text-[11px] font-semibold text-baidu-blue bg-blue-50 px-2.5 py-0.5 rounded-full flex items-center space-x-1 border border-blue-100 hover:bg-blue-100 transition">
            <i class="fa-solid fa-diamond-turn-right text-baidu-red text-[10px]"></i>
            <span>百度地圖直連</span>
          </a>
        </div>
      </div>

      <!-- Quick Search Bar -->
      <div class="px-4 py-2.5">
        <div class="relative flex items-center">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 text-slate-400 text-xs"></i>
          <input id="search-input" type="text" placeholder="搜尋餐廳名、菜系、路名或地標..." 
                 class="w-full bg-slate-100 pl-9 pr-9 py-2 rounded-xl text-xs outline-none focus:ring-2 focus:ring-baidu-blue border border-transparent focus:bg-white transition"
                 oninput="handleSearch(this.value)">
          <button id="clear-search-btn" class="hidden absolute right-3 text-slate-400 hover:text-slate-600 text-xs" onclick="clearSearch()">
            <i class="fa-solid fa-circle-xmark"></i>
          </button>
        </div>
      </div>

      <!-- Category Filter Horizontal Scroll Pills -->
      <div class="flex items-center space-x-2 px-4 pb-2.5 overflow-x-auto text-xs no-scrollbar">
        <button onclick="selectTag('全部標籤')" class="tag-pill px-3 py-1 rounded-full bg-slate-100 text-slate-600 font-medium whitespace-nowrap transition filter-pill-active" data-tag="全部標籤">全部</button>
        <button onclick="selectTag('火鍋/牛肉')" class="tag-pill px-3 py-1 rounded-full bg-slate-100 text-slate-600 font-medium whitespace-nowrap transition" data-tag="火鍋/牛肉">火鍋/牛肉</button>
        <button onclick="selectTag('燒烤/烤肉')" class="tag-pill px-3 py-1 rounded-full bg-slate-100 text-slate-600 font-medium whitespace-nowrap transition" data-tag="燒烤/烤肉">燒烤/烤肉</button>
        <button onclick="selectTag('粵菜/大排檔')" class="tag-pill px-3 py-1 rounded-full bg-slate-100 text-slate-600 font-medium whitespace-nowrap transition" data-tag="粵菜/大排檔">粵菜/大排檔</button>
        <button onclick="selectTag('異國料理')" class="tag-pill px-3 py-1 rounded-full bg-slate-100 text-slate-600 font-medium whitespace-nowrap transition" data-tag="異國料理">異國料理</button>
        <button onclick="selectTag('甜品/小吃')" class="tag-pill px-3 py-1 rounded-full bg-slate-100 text-slate-600 font-medium whitespace-nowrap transition" data-tag="甜品/小吃">甜品/小吃</button>
      </div>

      <!-- Sub Filter Controls: Area & Sorting -->
      <div class="flex items-center justify-between px-4 py-2 bg-slate-50/80 border-t border-slate-100 text-xs text-slate-600">
        <div class="flex items-center space-x-2">
          <!-- District Filter -->
          <div class="relative">
            <button onclick="toggleDropdown('city-dropdown')" class="flex items-center space-x-1 font-semibold text-slate-700 hover:text-baidu-blue">
              <i class="fa-solid fa-location-dot text-baidu-orange text-[11px]"></i>
              <span id="current-city-label">東莞市 (全部)</span>
              <i class="fa-solid fa-caret-down text-[9px] text-slate-400"></i>
            </button>
            <div id="city-dropdown" class="hidden absolute top-7 left-0 w-36 bg-white border border-slate-200 rounded-xl shadow-xl z-40 py-1 text-xs">
              <div onclick="selectCity('東莞市 (全部)')" class="px-3 py-2 hover:bg-slate-50 cursor-pointer font-bold text-baidu-blue">東莞市 (全部)</div>
              <div onclick="selectCity('東城區')" class="px-3 py-2 hover:bg-slate-50 cursor-pointer">東城區</div>
              <div onclick="selectCity('莞城區')" class="px-3 py-2 hover:bg-slate-50 cursor-pointer">莞城區</div>
              <div onclick="selectCity('石碣鎮')" class="px-3 py-2 hover:bg-slate-50 cursor-pointer">石碣鎮</div>
              <div onclick="selectCity('清溪鎮')" class="px-3 py-2 hover:bg-slate-50 cursor-pointer">清溪鎮</div>
              <div onclick="selectCity('高埗鎮')" class="px-3 py-2 hover:bg-slate-50 cursor-pointer">高埗鎮</div>
            </div>
          </div>
        </div>

        <div class="flex items-center space-x-3 text-slate-500">
          <div class="relative">
            <button onclick="toggleDropdown('sort-dropdown')" class="flex items-center space-x-1 font-medium hover:text-baidu-blue">
              <i class="fa-solid fa-arrow-down-short-wide text-[11px]"></i>
              <span id="current-sort-label">默認排序</span>
              <i class="fa-solid fa-caret-down text-[9px] text-slate-400"></i>
            </button>
            <div id="sort-dropdown" class="hidden absolute top-7 right-0 w-32 bg-white border border-slate-200 rounded-xl shadow-xl z-40 py-1 text-xs">
              <div onclick="applySort('default')" class="px-3 py-2 hover:bg-slate-50 cursor-pointer">默認排序</div>
              <div onclick="applySort('rating')" class="px-3 py-2 hover:bg-slate-50 cursor-pointer">評分最高</div>
              <div onclick="applySort('price-asc')" class="px-3 py-2 hover:bg-slate-50 cursor-pointer">價格由低到高</div>
              <div onclick="applySort('price-desc')" class="px-3 py-2 hover:bg-slate-50 cursor-pointer">價格由高到低</div>
            </div>
          </div>

          <span class="text-slate-300">|</span>
          <span class="font-bold text-slate-700">共 <span id="places-count" class="text-baidu-blue font-extrabold">18</span> 間</span>
        </div>
      </div>
    </header>

    <!-- Content List View -->
    <main class="flex-1 relative overflow-y-auto pb-24 px-3 pt-3 space-y-3" id="main-scroll-container">
      
      <!-- Special Landmark Card: 台達電子 (東莞) 7廠 -->
      <div class="bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 rounded-2xl p-3.5 text-white shadow-md relative overflow-hidden border border-slate-800">
        <div class="absolute -right-6 -bottom-6 opacity-10 text-white pointer-events-none">
          <i class="fa-solid fa-building-user text-8xl"></i>
        </div>
        <div class="flex items-start justify-between relative z-10">
          <div class="space-y-1">
            <div class="flex items-center space-x-2">
              <span class="px-2 py-0.5 rounded-full bg-amber-500 text-slate-950 text-[10px] font-black uppercase flex items-center space-x-1">
                <i class="fa-solid fa-star text-[9px]"></i>
                <span>企業基地地標</span>
              </span>
              <h3 class="font-bold text-sm tracking-wide text-white">台達電子 (東莞) 7廠</h3>
            </div>
            <p class="text-[11px] text-slate-300">東莞市石碣鎮鶴田廈村振園路6號</p>
          </div>
          <button onclick="openBaiduMapSearch('东莞市石碣镇台达电子(东莞)有限公司7厂')" 
                  class="px-2.5 py-1.5 rounded-xl bg-white/10 hover:bg-white/20 active:scale-95 text-xs text-amber-300 border border-amber-300/30 font-bold transition flex items-center space-x-1 shrink-0">
            <i class="fa-solid fa-location-arrow text-[10px]"></i>
            <span>百度搜尋地標</span>
          </button>
        </div>

        <div class="mt-3 pt-2.5 border-t border-white/10 flex items-center justify-between text-xs relative z-10">
          <span class="text-[11px] text-slate-300 flex items-center">
            <i class="fa-solid fa-fire text-amber-400 mr-1 text-[11px]"></i>
            廠區附近推薦：
          </span>
          <div class="flex space-x-2">
            <button onclick="quickFilterShops('哂贡 越南粉')" class="px-2 py-0.5 rounded-md bg-white/10 hover:bg-baidu-blue text-[11px] text-white transition">
              哂貢越南粉
            </button>
            <button onclick="quickFilterShops('新疆羊肉燒烤 (鶴田廈店)')" class="px-2 py-0.5 rounded-md bg-white/10 hover:bg-baidu-blue text-[11px] text-white transition">
              鶴田廈烤羊肉
            </button>
          </div>
        </div>
      </div>

      <!-- Places List Container -->
      <section id="places-list-view" class="space-y-3">
        <!-- Dynamically rendered via renderPlacesList() -->
      </section>

    </main>

    <!-- Fixed Bottom Action Bar -->
    <footer class="fixed bottom-0 max-w-md w-full bg-white/95 backdrop-blur-md border-t border-slate-200 z-30 px-4 py-2.5 flex items-center justify-center shadow-lg">
      <button onclick="openAddPlaceModal()" class="w-full bg-baidu-blue hover:bg-baidu-darkblue active:scale-98 text-white font-bold text-sm py-2.5 rounded-full shadow-md flex items-center justify-center space-x-2 transition">
        <i class="fa-solid fa-plus text-xs"></i>
        <span>添加新美食 (支援百度地圖即時驗證)</span>
      </button>
    </footer>

    <!-- MODAL 1: Add New Restaurant -->
    <div id="modal-add-place" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-end sm:items-center justify-center hidden opacity-0 transition-opacity duration-200">
      <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl max-h-[90vh] overflow-y-auto p-5 shadow-2xl">
        <div class="flex items-center justify-between pb-3 border-b border-slate-100">
          <div class="flex items-center space-x-2">
            <span class="w-2.5 h-2.5 bg-baidu-orange rounded-full"></span>
            <h3 class="text-base font-bold text-slate-900">新增美食地點</h3>
          </div>
          <button onclick="closeModal('modal-add-place')" class="text-slate-400 hover:text-slate-600 p-1">
            <i class="fa-solid fa-xmark text-lg"></i>
          </button>
        </div>

        <form id="form-add-place" onsubmit="handleCreatePlace(event)" class="mt-4 space-y-3.5 text-xs">
          <div>
            <div class="flex items-center justify-between mb-1">
              <label class="font-semibold text-slate-700">店名 / 餐廳名稱 *</label>
              <button type="button" onclick="previewBaiduSearchFromForm()" class="text-baidu-blue hover:underline text-[11px] font-semibold flex items-center space-x-1">
                <i class="fa-solid fa-arrow-up-right-from-square text-[9px]"></i>
                <span>在百度地圖預覽搜索</span>
              </button>
            </div>
            <input type="text" id="new-place-name" required placeholder="例如：喜茶 (世博廣場店)" 
                   class="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-baidu-blue outline-none">
          </div>

          <div>
            <label class="block font-semibold text-slate-700 mb-1">詳細地址 *</label>
            <input type="text" id="new-place-address" required placeholder="例如：東莞市東城街道世博廣場C區101號" 
                   class="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-baidu-blue outline-none">
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block font-semibold text-slate-700 mb-1">美食標籤類別</label>
              <select id="new-place-tag" class="w-full border border-slate-200 rounded-xl px-2 py-2 text-xs focus:ring-2 focus:ring-baidu-blue outline-none bg-white">
                <option value="火鍋/牛肉">火鍋/牛肉</option>
                <option value="燒烤/烤肉">燒烤/烤肉</option>
                <option value="粵菜/大排檔">粵菜/大排檔</option>
                <option value="異國料理">異國料理</option>
                <option value="甜品/小吃">甜品/小吃</option>
              </select>
            </div>
            <div>
              <label class="block font-semibold text-slate-700 mb-1">所在區域</label>
              <select id="new-place-area" class="w-full border border-slate-200 rounded-xl px-2 py-2 text-xs focus:ring-2 focus:ring-baidu-blue outline-none bg-white">
                <option value="東城區">東城區</option>
                <option value="莞城區">莞城區</option>
                <option value="石碣鎮">石碣鎮</option>
                <option value="清溪鎮">清溪鎮</option>
                <option value="高埗鎮">高埗鎮</option>
                <option value="其他區域">其他區域</option>
              </select>
            </div>
          </div>

          <div>
            <label class="block font-semibold text-slate-700 mb-1">人均消費 (預估 ¥)</label>
            <input type="number" id="new-place-price" min="5" max="2000" placeholder="例如：85" 
                   class="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-baidu-blue outline-none">
          </div>

          <div>
            <label class="block font-semibold text-slate-700 mb-1">推薦星級</label>
            <div class="flex items-center space-x-1.5 text-amber-400 text-lg cursor-pointer" id="new-rating-stars">
              <i class="fa-solid fa-star" onclick="setNewShopRating(1)"></i>
              <i class="fa-solid fa-star" onclick="setNewShopRating(2)"></i>
              <i class="fa-solid fa-star" onclick="setNewShopRating(3)"></i>
              <i class="fa-solid fa-star" onclick="setNewShopRating(4)"></i>
              <i class="fa-solid fa-star" onclick="setNewShopRating(5)"></i>
              <span id="new-rating-label" class="text-xs text-slate-500 font-semibold ml-2">5.0 分</span>
            </div>
          </div>

          <div>
            <label class="block font-semibold text-slate-700 mb-1">探店簡評與招牌菜</label>
            <textarea id="new-place-review" rows="2" placeholder="寫寫你的必吃推薦菜、口味、環境特色..." 
                      class="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-baidu-blue outline-none"></textarea>
          </div>

          <div class="pt-2 flex items-center justify-end space-x-2">
            <button type="button" onclick="closeModal('modal-add-place')" class="px-4 py-2 rounded-xl text-slate-600 hover:bg-slate-100 font-medium">取消</button>
            <button type="submit" class="px-5 py-2 rounded-xl bg-baidu-blue text-white font-bold hover:bg-baidu-darkblue shadow-md transition">立即保存地點</button>
          </div>
        </form>
      </div>
    </div>

    <!-- MODAL 2: Reviews & Rating Drawer -->
    <div id="modal-reviews-drawer" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-end sm:items-center justify-center hidden opacity-0 transition-opacity duration-200">
      <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl max-h-[88vh] flex flex-col p-5 shadow-2xl">
        <div class="flex items-start justify-between pb-3 border-b border-slate-100">
          <div>
            <span class="inline-block px-2 py-0.5 bg-orange-100 text-baidu-orange text-[10px] font-bold rounded-md mb-1" id="drawer-tag">火鍋</span>
            <h3 class="text-base font-bold text-slate-900 leading-tight" id="drawer-title">店名</h3>
            <p class="text-xs text-slate-500 mt-0.5" id="drawer-address">地址</p>
          </div>
          <button onclick="closeModal('modal-reviews-drawer')" class="text-slate-400 hover:text-slate-600 p-1">
            <i class="fa-solid fa-xmark text-lg"></i>
          </button>
        </div>

        <!-- Rating Summary Box -->
        <div class="flex items-center justify-between bg-slate-50 rounded-2xl p-3.5 my-3">
          <div class="flex items-center space-x-3">
            <span class="text-3xl font-extrabold text-amber-500" id="drawer-rating-num">4.8</span>
            <div>
              <div class="flex text-amber-400 text-xs" id="drawer-rating-stars">
                <i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star-half-stroke"></i>
              </div>
              <p class="text-[11px] text-slate-400 mt-0.5"><span id="drawer-reviews-count">3</span> 條真實評價</p>
            </div>
          </div>
          <button id="drawer-baidu-btn" class="px-3 py-1.5 bg-blue-50 border border-baidu-blue text-baidu-blue font-bold text-xs rounded-xl hover:bg-blue-100 active:scale-95 transition flex items-center space-x-1">
            <i class="fa-solid fa-location-arrow text-[10px]"></i>
            <span>百度地圖查看</span>
          </button>
        </div>

        <!-- Reviews Scrollable List -->
        <div class="flex-1 overflow-y-auto space-y-3 pr-1 py-1" id="drawer-reviews-list"></div>

        <!-- Add Review Form -->
        <div class="pt-3 border-t border-slate-100">
          <div class="flex items-center justify-between mb-1.5">
            <span class="text-xs font-semibold text-slate-700">添加我的評分</span>
            <div class="flex items-center space-x-1 text-amber-400 text-base" id="user-review-stars">
              <i class="fa-solid fa-star cursor-pointer" onclick="setUserRatingScore(1)"></i>
              <i class="fa-solid fa-star cursor-pointer" onclick="setUserRatingScore(2)"></i>
              <i class="fa-solid fa-star cursor-pointer" onclick="setUserRatingScore(3)"></i>
              <i class="fa-solid fa-star cursor-pointer" onclick="setUserRatingScore(4)"></i>
              <i class="fa-solid fa-star cursor-pointer" onclick="setUserRatingScore(5)"></i>
              <span id="user-rating-score-display" class="text-xs font-bold text-slate-700 ml-1">5.0</span>
            </div>
          </div>
          <div class="flex space-x-2">
            <input type="text" id="user-review-text" placeholder="留下您的美味點評或招牌菜推薦..." 
                   class="flex-1 border border-slate-200 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-baidu-blue outline-none">
            <button onclick="submitUserReview()" class="px-4 py-2 bg-baidu-blue text-white rounded-xl text-xs font-bold hover:bg-baidu-darkblue shrink-0 shadow-sm transition">
              發表
            </button>
          </div>
        </div>

      </div>
    </div>

    <!-- Toast Notification Box -->
    <div id="toast-box" class="fixed top-12 left-1/2 -translate-x-1/2 z-[60] bg-slate-900/90 text-white text-xs px-4 py-2 rounded-full shadow-lg pointer-events-none opacity-0 transition-opacity duration-300 flex items-center space-x-2">
      <i class="fa-solid fa-circle-check text-emerald-400"></i>
      <span id="toast-message">操作成功</span>
    </div>

  </div>

  <script>
    /* In-memory Restaurant Dataset */
    const INITIAL_RESTAURANTS = [
      {
        id: "r1",
        name: "蒸武門 (清溪店)",
        address: "清溪镇振兴一路28号301室",
        tag: "粤菜/大排档",
        type: "正餐餐厅",
        city: "清溪镇",
        rating: 4.7,
        avgPrice: 65,
        reviews: [
          { author: "食在东莞", score: 5, date: "2026-09-15", text: "传统蒸汽海鲜与客家蒸鸡，火候刚刚好，原汁原味！" },
          { author: "阿明", score: 4.5, date: "2026-08-20", text: "分量足，上菜快，汤头清甜可口。" }
        ]
      },
      {
        id: "r2",
        name: "Doc·意式窑烤披萨",
        address: "乌石岗工业路1号",
        tag: "异国料理",
        type: "休闲小酌",
        city: "东城区",
        rating: 4.8,

    /**
     * Builds standard official Baidu Map URI API URL
     * Safe across mobile web, desktop, and app
     */
    function getBaiduMapUrl(keyword, city = '东莞') {
      const cleanKeyword = keyword.trim();
      const cleanRegion = (city && city !== '東莞市 (全部)') 
        ? city.replace(/[（(].*?[）)]/g, '').trim() 
        : '东莞';
      
      // Official Baidu Map Place Search URI (No AK required, opens POI list or card directly)
      return `https://api.map.baidu.com/place/search?query=${encodeURIComponent(cleanKeyword)}&region=${encodeURIComponent(cleanRegion)}&output=html&src=webapp.baidu.foodmap`;
    }

    /**
     * Opens external URL safely to prevent iframe popup blocking
     */
    function openExternalUrl(url, label) {
      try {
        const link = document.createElement('a');
        link.href = url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast(`已前往百度地圖：${label}`);
      } catch (e) {
        window.open(url, '_blank');
      }
    }

    function openBaiduMapSearch(queryKeyword, city = '东莞') {
      const url = getBaiduMapUrl(queryKeyword, city);
      openExternalUrl(url, queryKeyword);
    }

    function searchPlaceOnBaidu(name, city) {
      const url = getBaiduMapUrl(name, city || '东莞');
      openExternalUrl(url, name);
    }

    function previewBaiduSearchFromForm() {
      const name = document.getElementById('new-place-name').value.trim();
      const area = document.getElementById('new-place-area').value;
      if (!name) {
        showToast('請先輸入店名再進行百度搜尋預覽');
        return;
      }
      searchPlaceOnBaidu(name, area);
    }

    function getFilteredPlaces() {
      let result = places.filter(item => {
        const matchTag = (currentFilterTag === '全部標籤' || item.tag === currentFilterTag);
        const matchCity = (currentFilterCity === '東莞市 (全部)' || item.city === currentFilterCity);
        const query = searchQuery.trim().toLowerCase();
        const matchSearch = !query || 
                            item.name.toLowerCase().includes(query) || 
                            item.address.toLowerCase().includes(query) ||
                            item.tag.toLowerCase().includes(query);
        return matchTag && matchCity && matchSearch;
      });

      if (currentSortOrder === 'rating') {
        result.sort((a, b) => b.rating - a.rating);
      } else if (currentSortOrder === 'price-asc') {
        result.sort((a, b) => (a.avgPrice || 9999) - (b.avgPrice || 9999));
      } else if (currentSortOrder === 'price-desc') {
        result.sort((a, b) => (b.avgPrice || 0) - (a.avgPrice || 0));
      }

      return result;
    }

    function toggleDropdown(id) {
      const el = document.getElementById(id);
      const isHidden = el.classList.contains('hidden');
      ['city-dropdown', 'sort-dropdown'].forEach(d => {
        const item = document.getElementById(d);
        if (item) item.classList.add('hidden');
      });
      if (isHidden) el.classList.remove('hidden');
    }

    function selectTag(tag) {
      currentFilterTag = tag;
      document.querySelectorAll('.tag-pill').forEach(btn => {
        if (btn.getAttribute('data-tag') === tag) {
          btn.classList.add('filter-pill-active');
        } else {
          btn.classList.remove('filter-pill-active');
        }
      });
      renderPlacesList();
    }

    function selectCity(city) {
      currentFilterCity = city;
      document.getElementById('current-city-label').textContent = city;
      document.getElementById('city-dropdown').classList.add('hidden');

          author: "我",
          score: newShopRatingValue,
          date: new Date().toISOString().split('T')[0],
          text: reviewText
        });
      }

      places.unshift(newPlace);
      closeModal('modal-add-place');
      renderPlacesList();

      showToast(`已新增「${name}」！點擊即可百度地圖導航。`);
    }

    function openReviewsDrawer(placeId) {
      currentReviewingPlaceId = placeId;
      const place = places.find(p => p.id === placeId);
      if (!place) return;

      document.getElementById('drawer-title').textContent = place.name;
      document.getElementById('drawer-address').textContent = place.address;
      document.getElementById('drawer-tag').textContent = place.tag;
      document.getElementById('drawer-rating-num').textContent = Number(place.rating).toFixed(1);
      document.getElementById('drawer-reviews-count').textContent = place.reviews ? place.reviews.length : 0;
      
      const baiduBtn = document.getElementById('drawer-baidu-btn');
      baiduBtn.onclick = () => searchPlaceOnBaidu(place.name, place.city);

      renderDrawerStars(place.rating);
      renderDrawerReviewsList(place);

      userReviewRatingValue = 5.0;
      setUserRatingScore(5);
      document.getElementById('user-review-text').value = '';

      openModal('modal-reviews-drawer');
    }

    function renderDrawerStars(score) {
      const container = document.getElementById('drawer-rating-stars');
      let starsHtml = '';
      for (let i = 1; i <= 5; i++) {
        if (score >= i) {
          starsHtml += '<i class="fa-solid fa-star"></i>';
        } else if (score >= i - 0.5) {
          starsHtml += '<i class="fa-solid fa-star-half-stroke"></i>';
        } else {
          starsHtml += '<i class="fa-regular fa-star text-slate-300"></i>';
        }
      }
      container.innerHTML = starsHtml;
    }

    function renderDrawerReviewsList(place) {
      const listContainer = document.getElementById('drawer-reviews-list');
      if (!place.reviews || place.reviews.length === 0) {
        listContainer.innerHTML = `
          <div class="py-8 text-center text-slate-400 text-xs">
            <i class="fa-regular fa-comment-dots text-2xl mb-2 text-slate-300"></i>
            <p>暫無評價，快來留下第一個打分點評！</p>
          </div>
        `;
        return;
      }

      let html = '';
      place.reviews.forEach(rev => {
        let starsHtml = '';
        for (let i = 1; i <= 5; i++) {
          starsHtml += (i <= rev.score) 
            ? '<i class="fa-solid fa-star text-amber-400"></i>' 
            : '<i class="fa-regular fa-star text-slate-200"></i>';
        }

        html += `
          <div class="p-3 bg-slate-50 rounded-2xl text-xs space-y-1.5 border border-slate-100">
            <div class="flex items-center justify-between">
              <div class="flex items-center space-x-2">
                <div class="w-6 h-6 rounded-full bg-blue-100 text-baidu-blue font-bold flex items-center justify-center text-[10px]">
                  ${rev.author ? rev.author.charAt(0) : '客'}
                </div>
                <span class="font-bold text-slate-800">${escapeHtml(rev.author)}</span>
              </div>
              <span class="text-[10px] text-slate-400">${rev.date}</span>
            </div>
            <div class="flex items-center space-x-1 text-[10px]">
              ${starsHtml}
              <span class="text-amber-500 font-semibold ml-1">${Number(rev.score).toFixed(1)}分</span>
            </div>
            <p class="text-slate-700 leading-relaxed font-normal">${escapeHtml(rev.text)}</p>
          </div>
        `;
      });

      listContainer.innerHTML = html;
    }

    function setUserRatingScore(score) {
      userReviewRatingValue = score;
      const container = document.getElementById('user-review-stars');
      const icons = container.querySelectorAll('i');
      icons.forEach((icon, idx) => {
        if (idx < score) {
          icon.className = 'fa-solid fa-star cursor-pointer';
        } else {
          icon.className = 'fa-regular fa-star cursor-pointer text-slate-300';
        }
      });
      document.getElementById('user-rating-score-display').textContent = `${score}.0`;
    }

    function submitUserReview() {
      const text = document.getElementById('user-review-text').value.trim();
      if (!text) {
        showToast('請輸入評價內容！');
        return;
      }

      const place = places.find(p => p.id === currentReviewingPlaceId);
      if (!place) return;

      const newReview = {
        author: "美食探索官",
        score: userReviewRatingValue,
        date: new Date().toISOString().split('T')[0],
        text: text
      };

      if (!place.reviews) place.reviews = [];
      place.reviews.unshift(newReview);

      const sum = place.reviews.reduce((acc, r) => acc + r.score, 0);
      place.rating = parseFloat((sum / place.reviews.length).toFixed(1));

      document.getElementById('drawer-rating-num').textContent = Number(place.rating).toFixed(1);
      document.getElementById('drawer-reviews-count').textContent = place.reviews.length;
      renderDrawerStars(place.rating);
      renderDrawerReviewsList(place);
      document.getElementById('user-review-text').value = '';

      renderPlacesList();
      showToast('感謝您的點評！');
    }

    function showPlaceActionSheet(placeId) {
      const place = places.find(p => p.id === placeId);
      if (!place) return;

      confirmModal(
        place.name,
        place.address,
        [
          { 
            label: '百度地圖直連開啟', 
            primary: true, 
            action: () => searchPlaceOnBaidu(place.name, place.city) 
          },
          { 
            label: '高德地圖搜尋開啟', 
            primary: false, 
            action: () => openExternalUrl(`https://uri.amap.com/search?keyword=${encodeURIComponent(place.name + ' ' + (place.city || '东莞'))}`, place.name) 
          },
          { 
            label: '複製詳細地址', 
            primary: false, 
            action: () => copyTextToClipboard(place.address) 
          },
          { 
            label: '查看與撰寫評價', 
            primary: false, 
            action: () => openReviewsDrawer(place.id) 
          },
          { 
            label: '移除此店鋪', 
            danger: true, 
            action: () => deletePlace(place.id) 
          }
        ]
      );
    }

    function copyTextToClipboard(text) {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      textArea.style.position = "fixed";
      textArea.style.opacity = "0";
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();
      try {
        document.execCommand('copy');
        showToast('已複製地址至剪貼簿！');
      } catch (err) {
        showToast('複製失敗，請手動複製');
      }
      document.body.removeChild(textArea);
    }

    function deletePlace(placeId) {
      places = places.filter(p => p.id !== placeId);
      renderPlacesList();
      showToast('已從店鋪清單移除');
    }

    let toastTimer = null;
    function showToast(msg) {
      const toast = document.getElementById('toast-box');
      const message = document.getElementById('toast-message');
      message.textContent = msg;
      toast.classList.remove('opacity-0');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.add('opacity-0');
      }, 2400);
    }

    function confirmModal(title, msg, buttons) {
      const existing = document.getElementById('custom-confirm-modal');
      if (existing) existing.remove();

      const modalEl = document.createElement('div');
      modalEl.id = 'custom-confirm-modal';
      modalEl.className = 'fixed inset-0 z-[100] bg-black/50 backdrop-blur-xs flex items-center justify-center p-4';
      
      let buttonsHtml = '';
      buttons.forEach((btn, index) => {
        let btnClass = 'w-full py-2.5 rounded-xl font-bold text-xs transition ';
        if (btn.danger) {
          btnClass += 'bg-red-50 text-red-600 hover:bg-red-100';
        } else if (btn.primary) {
          btnClass += 'bg-baidu-blue text-white hover:bg-baidu-darkblue shadow-xs';
        } else {
          btnClass += 'bg-slate-100 text-slate-700 hover:bg-slate-200';
        }
        buttonsHtml += `<button id="custom-modal-btn-${index}" class="${btnClass}">${btn.label}</button>`;
      });

      modalEl.innerHTML = `
        <div class="bg-white rounded-2xl w-full max-w-xs p-5 shadow-2xl space-y-4">
          <div>
            <h4 class="font-bold text-slate-900 text-sm truncate">${escapeHtml(title)}</h4>
            <p class="text-xs text-slate-500 mt-1">${escapeHtml(msg)}</p>
          </div>
          <div class="space-y-2 pt-2">
            ${buttonsHtml}
            <button id="custom-modal-cancel" class="w-full py-2 rounded-xl text-slate-400 text-xs hover:text-slate-600">取消</button>
          </div>
        </div>
      `;

      document.body.appendChild(modalEl);

      buttons.forEach((btn, index) => {
        document.getElementById(`custom-modal-btn-${index}`).addEventListener('click', () => {
          modalEl.remove();
          if (btn.action) btn.action();
        });
      });

      document.getElementById('custom-modal-cancel').addEventListener('click', () => {
        modalEl.remove();
      });
    }

    function escapeHtml(string) {
      if (!string) return '';
      return String(string)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function escapeJsString(string) {
      if (!string) return '';
      return String(string).replace(/'/g, "\\'").replace(/"/g, '\\"');
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderPlacesList();

      document.addEventListener('click', (e) => {
        if (!e.target.closest('#city-dropdown') && !e.target.closest('[onclick*="city-dropdown"]')) {
          const cd = document.getElementById('city-dropdown');
          if (cd) cd.classList.add('hidden');
        }
        if (!e.target.closest('#sort-dropdown') && !e.target.closest('[onclick*="sort-dropdown"]')) {
          const sd = document.getElementById('sort-dropdown');
          if (sd) sd.classList.add('hidden');
        }
      });
    });
  </script>
</body>
</html>
